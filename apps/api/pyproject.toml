[project]
name = "markov-reliability-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "numpy>=2.2,<3",
  "scipy>=1.15,<2", "networkx>=3.4,<4", "pandas>=2.2,<4",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.34,<1", "reportlab>=4.3,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10", "pytest-cov>=6,<8", "hypothesis>=6.125,<7",
  "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "networkx.*", "pandas.*", "reportlab.*"]
ignore_missing_imports = true
