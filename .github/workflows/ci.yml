name: Continuous integration
on: [push, pull_request]
jobs:
  lab:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: markov
          POSTGRES_PASSWORD: test
          POSTGRES_DB: markov
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U markov" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://markov:test@127.0.0.1:5432/markov
      TEST_DATABASE_URL: postgresql+psycopg://markov:test@127.0.0.1:5432/markov
      NEXT_TELEMETRY_DISABLED: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: uv sync --locked
        working-directory: apps/api
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: make lint test build
      - run: make contracts && git diff --exit-code -- packages/contracts
      - run: docker compose config -q
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Playwright
        run: |
          (cd apps/api && uv run alembic upgrade head && uv run uvicorn markov_lab.main:app) &
          pnpm --dir apps/web start &
          for attempt in {1..45}; do
            curl --fail --silent http://localhost:3000/lab-api/examples > /dev/null && break
            sleep 2
          done
          pnpm --dir apps/web e2e
